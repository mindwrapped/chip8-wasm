<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHIP-8 Emulator</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Share Tech Mono', 'Courier New', monospace;
            background: #0a0a0a;
            background-image: 
                radial-gradient(circle at 20% 50%, #1a1a2e 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, #16213e 0%, transparent 50%),
                linear-gradient(180deg, #0a0a0a 0%, #1a1a1a 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #00ff41;
            position: relative;
            overflow-x: hidden;
        }

        /* CRT scanline effect */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.15),
                rgba(0, 0, 0, 0.15) 1px,
                transparent 1px,
                transparent 2px
            );
            pointer-events: none;
            z-index: 1000;
            animation: scanline 8s linear infinite;
        }

        @keyframes scanline {
            0% { transform: translateY(0); }
            100% { transform: translateY(4px); }
        }

        /* Subtle screen flicker */
        @keyframes flicker {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.98; }
        }

        .container {
            background: #1a1a1a;
            border: 3px solid #333;
            border-top: 4px solid #444;
            border-bottom: 4px solid #222;
            box-shadow: 
                0 0 20px rgba(0, 255, 65, 0.1),
                inset 0 0 30px rgba(0, 0, 0, 0.5),
                0 10px 50px rgba(0, 0, 0, 0.8);
            padding: 25px;
            max-width: 900px;
            width: 100%;
            position: relative;
            animation: flicker 0.15s infinite;
        }

        .container::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, #00ff41, #00cc33, #00ff41);
            opacity: 0.1;
            z-index: -1;
            filter: blur(10px);
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 2px solid #00ff41;
            padding-bottom: 15px;
            position: relative;
        }

        h1 {
            font-family: 'Orbitron', monospace;
            font-size: 2.2em;
            font-weight: 900;
            color: #00ff41;
            text-shadow: 
                0 0 10px #00ff41,
                0 0 20px #00ff41,
                0 0 30px #00ff41,
                2px 2px 0px #003311;
            letter-spacing: 3px;
            margin-bottom: 5px;
        }

        .subtitle {
            font-size: 0.7em;
            color: #00cc33;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .display-wrapper {
            background: #000;
            border: 8px solid #2a2a2a;
            border-top: 10px solid #333;
            border-bottom: 10px solid #1a1a1a;
            padding: 15px;
            margin: 20px auto;
            box-shadow: 
                inset 0 0 30px rgba(0, 0, 0, 0.8),
                0 0 20px rgba(0, 255, 65, 0.2);
            position: relative;
            max-width: 680px;
        }

        .display-wrapper::before {
            content: 'CHIP-8';
            position: absolute;
            top: 5px;
            left: 15px;
            font-size: 0.6em;
            color: #00ff41;
            opacity: 0.3;
            letter-spacing: 2px;
        }

        .display-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        canvas {
            border: 2px solid #00ff41;
            background: #000;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            box-shadow: 
                0 0 20px rgba(0, 255, 65, 0.3),
                inset 0 0 10px rgba(0, 255, 65, 0.1);
            display: block;
        }

        .controls-section {
            margin: 25px 0;
        }

        .section-title {
            font-family: 'Orbitron', monospace;
            font-size: 0.9em;
            color: #00ff41;
            text-align: center;
            margin-bottom: 15px;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 5px #00ff41;
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin: 15px auto;
            max-width: 320px;
        }

        .key {
            aspect-ratio: 1;
            background: #1a1a1a;
            border: 2px solid #333;
            border-top: 2px solid #444;
            border-bottom: 2px solid #222;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.1s;
            user-select: none;
            color: #00ff41;
            text-shadow: 0 0 5px #00ff41;
            font-family: 'Orbitron', monospace;
            box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.5);
        }

        .key:hover {
            background: #222;
            border-color: #00ff41;
            box-shadow: 
                0 0 10px rgba(0, 255, 65, 0.5),
                inset 0 2px 5px rgba(0, 0, 0, 0.5);
        }

        .key.active {
            background: #003311;
            border-color: #00ff41;
            color: #00ff88;
            box-shadow: 
                0 0 15px rgba(0, 255, 65, 0.8),
                inset 0 0 10px rgba(0, 255, 65, 0.3);
            transform: scale(0.95);
        }

        .file-input-container {
            margin: 20px 0;
            text-align: center;
        }

        input[type="file"] {
            display: none;
        }

        .file-label {
            display: inline-block;
            padding: 12px 30px;
            background: #1a1a1a;
            border: 2px solid #00ff41;
            color: #00ff41;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: bold;
            font-family: 'Orbitron', monospace;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-shadow: 0 0 5px #00ff41;
            box-shadow: 
                0 0 10px rgba(0, 255, 65, 0.3),
                inset 0 2px 5px rgba(0, 0, 0, 0.5);
        }

        .file-label:hover {
            background: #003311;
            box-shadow: 
                0 0 15px rgba(0, 255, 65, 0.6),
                inset 0 2px 5px rgba(0, 0, 0, 0.5);
            transform: translateY(-1px);
        }

        .info-panel {
            margin-top: 20px;
            padding: 15px;
            background: #0a0a0a;
            border: 1px solid #333;
            border-left: 3px solid #00ff41;
        }

        .keyboard-hint {
            text-align: center;
            margin: 10px 0;
            font-size: 0.85em;
            color: #00cc33;
            letter-spacing: 1px;
        }

        .status {
            text-align: center;
            margin-top: 15px;
            font-size: 0.9em;
            min-height: 20px;
            color: #00ff41;
            font-family: 'Share Tech Mono', monospace;
            text-shadow: 0 0 5px #00ff41;
        }

        .key-mapping {
            margin-top: 15px;
            font-size: 0.75em;
            color: #666;
            text-align: center;
            letter-spacing: 1px;
            font-family: 'Share Tech Mono', monospace;
        }

        .status::before {
            content: '> ';
            color: #00ff41;
        }

        /* Terminal-style blinking cursor for status */
        .status.active::after {
            content: '_';
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        /* Retro corner decorations */
        .container::after {
            content: '';
            position: absolute;
            top: 10px;
            right: 10px;
            width: 20px;
            height: 20px;
            border-top: 2px solid #00ff41;
            border-right: 2px solid #00ff41;
            opacity: 0.3;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>CHIP-8 EMULATOR</h1>
            <div class="subtitle">WebAssembly Implementation</div>
        </div>
        
        <div class="display-wrapper">
            <div class="display-container">
                <canvas id="display" width="64" height="32"></canvas>
            </div>
        </div>

        <div class="file-input-container">
            <label for="rom-input" class="file-label">▶ LOAD ROM</label>
            <input type="file" id="rom-input" accept=".ch8,.rom">
        </div>

        <div class="controls-section">
            <div class="section-title">Keypad</div>
            <div class="controls">
                <div class="key" data-key="1">1</div>
                <div class="key" data-key="2">2</div>
                <div class="key" data-key="3">3</div>
                <div class="key" data-key="C">C</div>
                <div class="key" data-key="4">4</div>
                <div class="key" data-key="5">5</div>
                <div class="key" data-key="6">6</div>
                <div class="key" data-key="D">D</div>
                <div class="key" data-key="7">7</div>
                <div class="key" data-key="8">8</div>
                <div class="key" data-key="9">9</div>
                <div class="key" data-key="E">E</div>
                <div class="key" data-key="A">A</div>
                <div class="key" data-key="0">0</div>
                <div class="key" data-key="B">B</div>
                <div class="key" data-key="F">F</div>
            </div>
        </div>

        <div class="info-panel">
            <div class="keyboard-hint">
                KEYBOARD: 1-9, 0, A-F KEYS
            </div>
            <div class="key-mapping">
                MAPPING: 1-2-3-C | 4-5-6-D | 7-8-9-E | A-0-B-F
            </div>
        </div>

        <div class="status active" id="status"></div>
    </div>

    <script src="chip8.js"></script>
    <script>
        // Wait for WASM to load
        Module.onRuntimeInitialized = function() {
            const canvas = document.getElementById('display');
            const ctx = canvas.getContext('2d');
            const scale = 10;
            canvas.width = 64 * scale;
            canvas.height = 32 * scale;

            // Initialize CHIP-8
            Module.ccall('init_chip8', null, [], []);
            
            // Keyboard mapping: CHIP-8 keypad to keyboard keys
            const keyMap = {
                '1': 0x1, '2': 0x2, '3': 0x3, '4': 0xC,
                'q': 0x4, 'w': 0x5, 'e': 0x6, 'r': 0xD,
                'a': 0x7, 's': 0x8, 'd': 0x9, 'f': 0xE,
                'z': 0xA, 'x': 0x0, 'c': 0xB, 'v': 0xF
            };

            // Alternative mapping using number row
            const altKeyMap = {
                '1': 0x1, '2': 0x2, '3': 0x3, '4': 0xC,
                '5': 0x4, '6': 0x5, '7': 0x6, '8': 0xD,
                '9': 0x7, '0': 0x8, '-': 0x9, '=': 0xE,
                'q': 0xA, 'w': 0x0, 'e': 0xB, 'r': 0xF
            };

            let pressedKeys = new Set();

            function updateKey(key, pressed) {
                const chip8Key = keyMap[key.toLowerCase()] ?? altKeyMap[key.toLowerCase()];
                if (chip8Key !== undefined) {
                    Module.ccall('set_key', null, ['number', 'boolean'], [chip8Key, pressed]);
                    updateKeyDisplay(chip8Key, pressed);
                }
            }

            function updateKeyDisplay(chip8Key, pressed) {
                const keyLabels = {
                    0x1: '1', 0x2: '2', 0x3: '3', 0xC: 'C',
                    0x4: '4', 0x5: '5', 0x6: '6', 0xD: 'D',
                    0x7: '7', 0x8: '8', 0x9: '9', 0xE: 'E',
                    0xA: 'A', 0x0: '0', 0xB: 'B', 0xF: 'F'
                };
                const label = keyLabels[chip8Key];
                if (label) {
                    const keyElement = document.querySelector(`[data-key="${label}"]`);
                    if (keyElement) {
                        keyElement.classList.toggle('active', pressed);
                    }
                }
            }

            // Keyboard events
            document.addEventListener('keydown', (e) => {
                if (!pressedKeys.has(e.key)) {
                    pressedKeys.add(e.key);
                    updateKey(e.key, true);
                }
            });

            document.addEventListener('keyup', (e) => {
                pressedKeys.delete(e.key);
                updateKey(e.key, false);
            });

            // Mouse/touch events for on-screen keypad
            document.querySelectorAll('.key').forEach(key => {
                const chip8KeyMap = {
                    '1': 0x1, '2': 0x2, '3': 0x3, 'C': 0xC,
                    '4': 0x4, '5': 0x5, '6': 0x6, 'D': 0xD,
                    '7': 0x7, '8': 0x8, '9': 0x9, 'E': 0xE,
                    'A': 0xA, '0': 0x0, 'B': 0xB, 'F': 0xF
                };
                const keyValue = chip8KeyMap[key.dataset.key];
                
                key.addEventListener('mousedown', () => {
                    Module.ccall('set_key', null, ['number', 'boolean'], [keyValue, true]);
                    key.classList.add('active');
                });
                
                key.addEventListener('mouseup', () => {
                    Module.ccall('set_key', null, ['number', 'boolean'], [keyValue, false]);
                    key.classList.remove('active');
                });
                
                key.addEventListener('mouseleave', () => {
                    Module.ccall('set_key', null, ['number', 'boolean'], [keyValue, false]);
                    key.classList.remove('active');
                });
            });

            // ROM loading
            document.getElementById('rom-input').addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        try {
                            const arrayBuffer = event.target.result;
                            const uint8Array = new Uint8Array(arrayBuffer);
                            
                            // Allocate memory in WASM
                            const romPtr = Module._malloc(uint8Array.length);
                            if (!romPtr) {
                                const statusEl = document.getElementById('status');
                                statusEl.textContent = 'ERROR: FAILED TO ALLOCATE MEMORY';
                                statusEl.classList.add('active');
                                return;
                            }
                            
                            // Copy ROM data to WASM memory
                            // Use writeArrayToMemory (cleanest method, exported in Makefile)
                            if (Module.writeArrayToMemory) {
                                Module.writeArrayToMemory(uint8Array, romPtr);
                            }
                            // Fallback: try HEAPU8
                            else if (Module.HEAPU8) {
                                Module.HEAPU8.set(uint8Array, romPtr);
                            }
                            // Fallback: use HEAPU32.buffer (same as display code)
                            else if (Module.HEAPU32 && Module.HEAPU32.buffer) {
                                const heapView = new Uint8Array(Module.HEAPU32.buffer, romPtr, uint8Array.length);
                                heapView.set(uint8Array);
                            }
                            else {
                                throw new Error('Cannot access WASM memory. Module properties: ' + Object.keys(Module).filter(k => k.includes('HEAP') || k === 'buffer').join(', '));
                            }
                            
                            // Load ROM
                            const success = Module.ccall('load_rom', 'boolean', ['number', 'number'], [romPtr, uint8Array.length]);
                            
                            // Free memory
                            Module._free(romPtr);
                            
                            const statusEl = document.getElementById('status');
                            if (success) {
                                statusEl.textContent = `LOADED: ${file.name.toUpperCase()}`;
                                statusEl.classList.add('active');
                            } else {
                                statusEl.textContent = 'ERROR: FAILED TO LOAD ROM';
                                statusEl.classList.add('active');
                            }
                        } catch (error) {
                            const statusEl = document.getElementById('status');
                            statusEl.textContent = `ERROR: ${error.message.toUpperCase()}`;
                            statusEl.classList.add('active');
                            console.error('ROM loading error:', error);
                        }
                    };
                    reader.readAsArrayBuffer(file);
                }
            });

            // Main emulation loop
            let lastTime = performance.now();
            const targetFPS = 60;
            const frameTime = 1000 / targetFPS;
            const cyclesPerFrame = 10; // Run 10 instructions per frame

            function gameLoop(currentTime) {
                const deltaTime = currentTime - lastTime;
                
                if (deltaTime >= frameTime) {
                    // Update timers at 60Hz
                    Module.ccall('update_timers', null, [], []);
                    
                    // Run multiple cycles per frame
                    for (let i = 0; i < cyclesPerFrame; i++) {
                        Module.ccall('run_cycle', null, [], []);
                    }
                    
                    // Check if display needs updating
                    const needsDraw = Module.ccall('get_draw_flag', 'boolean', [], []);
                    if (needsDraw) {
                        const imageData = ctx.createImageData(64, 32);
                        
                        // Read pixels one by one (not the fastest, but works without heap access)
                        for (let y = 0; y < 32; y++) {
                            for (let x = 0; x < 64; x++) {
                                const pixel = Module.ccall('get_pixel', 'number', ['number', 'number'], [x, y]);
                                const idx = (y * 64 + x) * 4;
                                imageData.data[idx] = (pixel >> 16) & 0xFF;     // R
                                imageData.data[idx + 1] = (pixel >> 8) & 0xFF;  // G
                                imageData.data[idx + 2] = pixel & 0xFF;         // B
                                imageData.data[idx + 3] = 255;                   // A
                            }
                        }
                        
                        ctx.putImageData(imageData, 0, 0);
                        ctx.imageSmoothingEnabled = false;
                        ctx.drawImage(canvas, 0, 0, 64, 32, 0, 0, 64 * scale, 32 * scale);
                    }
                    
                    lastTime = currentTime - (deltaTime % frameTime);
                }
                
                requestAnimationFrame(gameLoop);
            }

            requestAnimationFrame(gameLoop);
            const statusEl = document.getElementById('status');
            statusEl.textContent = 'READY - LOAD A ROM TO START';
            statusEl.classList.add('active');
        };
    </script>
</body>
</html>
